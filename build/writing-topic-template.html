<style>
  :root {
    --bg: #f3ede1;
    --fg: #4a4238;
    --name: #231f1a;
    --dim: #6e624e;
    --rule: #e2d9c8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 Helvetica, Arial, sans-serif;
    font-size: 14.8px;
    font-weight: 400;
    line-height: 1.8;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* A reading page, so the wrap is the homepage's text measure — 520px of

    width: min(90vw, 576px);
    min-width: 320px;
    margin: 0 auto;
    padding: 40px 28px 56px;
  }

  .back {
    color: var(--dim);
    font-size: 12.7px;
    text-decoration: none;
  }
  .back:hover { color: var(--name); }

  .title {
    color: var(--name);
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-top: 10px;
  }

  .lede { color: var(--dim); font-size: 12.7px; margin-bottom: 26px; }

  p { margin-bottom: 22px; }

  a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
    text-decoration-color: var(--rule);
  }
  a:hover { text-decoration-color: currentColor; }
  a.back { text-decoration: none; }

  hr {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 24px 0;
  }

  strong { color: var(--name); font-weight: 600; }
  em { font-style: italic; }
