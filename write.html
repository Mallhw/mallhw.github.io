<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the writing room</title>
<meta name="robots" content="noindex">
<style>
  /* patrickcollison.com's clothes, measured off the live stylesheet: plain
     Helvetica body, Myriad Pro / Helvetica Neue headings, #0864c7 links, a
     narrow column on white. The point of this page is that typing here feels
     like typing onto a finished site, not into a docs toolbar. */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.7;
    color: #222;
    background: #ffffff;
    min-height: 100vh;
  }

  a { color: #0864c7; }

  .page {
    max-width: 540px;
    margin: 0 auto;
    padding: 56px 20px 120px;
  }

  /* ---- the quiet menu, collison-style, top right ---- */
  .menu {
    position: fixed;
    top: 24px;
    right: 24px;
    text-align: right;
    font-family: "Myriad Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 12px;
    line-height: 2;
    max-width: 180px;
  }
  .menu button, .menu select {
    display: block;
    margin-left: auto;
    background: none;
    border: none;
    font: inherit;
    color: #0864c7;
    cursor: pointer;
    padding: 0;
    text-align: right;
  }
  .menu select { direction: rtl; max-width: 180px; }
  .menu button:hover { text-decoration: underline; }
  .menu .status {
    color: #aaa;
    font-size: 10px;
    margin-top: 8px;
  }
  @media (max-width: 900px) {
    .menu { position: static; text-align: left; margin: 0 0 32px; }
    .menu button, .menu select { margin-left: 0; text-align: left; }
  }

  /* ---- the essay being written ---- */
  h1 {
    font-family: "Myriad Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.2;
    outline: none;
  }
  .byline {
    font-size: 10px;
    color: #aaa;
    margin: 6px 0 26px;
  }
  #body {
    outline: none;
    min-height: 55vh;
    white-space: pre-wrap;
  }
  #body p { margin-bottom: 1em; }
  #body hr { border: none; border-top: 1px solid #ddd; margin: 1.6em 0; }

  /* Placeholders that vanish the moment there are words. */
  [data-empty="true"]::before {
    content: attr(data-placeholder);
    color: #ccc;
    cursor: text;
  }

  .hint {
    margin-top: 64px;
    font-size: 10px;
    color: #ccc;
  }

  /* ---- the proofread report ---- */
  .issues {
    margin-top: 40px;
    border-top: 1px solid #eee;
    padding-top: 16px;
    font-size: 12px;
  }
  .issues .issues-head {
    font-family: "Myriad Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #aaa;
    margin-bottom: 10px;
  }
  .issue { margin-bottom: 10px; }
  .issue .find {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    color: #0864c7;
    cursor: pointer;
  }
  .issue .find:hover { text-decoration: underline; }
  .issue .msg { color: #555; }
  .chip {
    display: inline-block;
    background: none;
    border: 1px solid #0864c7;
    border-radius: 3px;
    color: #0864c7;
    font: inherit;
    font-size: 11px;
    line-height: 1.5;
    padding: 0 6px;
    margin-left: 6px;
    cursor: pointer;
  }
  .chip:hover { background: #0864c7; color: #fff; }
</style>
</head>
<body>

<div class="menu">
  <select id="drafts" aria-label="drafts"></select>
  <button id="new" type="button">new draft</button>
  <button id="proof" type="button">proofread</button>
  <button id="export" type="button">export page</button>
  <button id="copy" type="button">copy html</button>
  <button id="del" type="button">delete draft</button>
  <div class="status" id="status">&nbsp;</div>
</div>

<div class="page">
  <h1 id="title" contenteditable="true" spellcheck="true"
      data-placeholder="untitled"></h1>
  <p class="byline" id="byline"></p>
  <div id="body" contenteditable="true" spellcheck="true"
       data-placeholder="start typing. cmd+b bold, cmd+i italic, cmd+k link."></div>
  <div class="issues" id="issues" hidden></div>

  <p class="hint">
    autosaves to this browser as you type. proofread (also run automatically on
    export) sends the essay text to languagetool.org &mdash; the one thing on this
    page that touches the network, and only when you ask. export writes a
    finished page &mdash; drop it in writing/ and add the row to writing.html.
  </p>
</div>

<script>
(function () {
  "use strict";

  var TEMPLATE = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<!-- 1. Title: keep the em dash pattern. 2. Description: one sentence. -->\n<title>TOPIC \u2014 matthew li</title>\n<meta name=\"description\" content=\"matthew li on TOPIC.\">\n<link rel=\"icon\" href=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAYAAAA9zQYyAAAIxElEQVR42u2d3WtV2RmHn4Z8GEKqZkKwjmkQHc3IQTtakWmtLYNUSinCXMxNodC7/hW96V3/pmGQaacidkZHQvxIJWhMJogfY0OI0Rh6sX4HNuk5GmdGk33O88DmJOcc4zl7P/vd73rX2mv96O9//QsinUKPu0AUWkShRRRaRKFFoUUUWkShRRRaRKFFoUUUWkShRRRaRKFFoUUUWkShRRRaRKFFoUUUWkShRRRaRKFFoUUUWkShRRRaRKFFoUUUWkShRRRaRKFFoUUUWkShRRRaFFpEoUUUWkShRRRaFFpEoUUUWkShRRRaFFpEoUUUWkShRRRaFFpEoUUUWkShRRRaFFpEoUW2it4af/Z9wAAwBAzn5xfAE2ABuO/hVeg68S7QH5l/DOzI84/zvfqBRWDNw6zQdeD9ROWdwK6I3ZMIPQ/ci9APsj3xcCv0duZk0o0RYDRiDwDLEfpOUo8FYC6/38vrotDbjtOJyqN5rHI0OXQzUt8CriaC3wTWPfQKvd04nIjcjrFsR4AJoA94FNEfdsnx3Q/8GvgYOAsM5vt/CXwBfA581UlXrTqX7fo2+b4BoJETYDwpSrfQH4mH89g80SeAA8ChSN9vhN56vomcg5s8cUfz/uEukXlH9s1Q2hdVjmSf9MSBoaRljxV667gOvJOoO7rJSN2byN5L55fz+irft1VqNkkpfY4nSl9KO2NWobeGK7l8LqURuOsV739eaQx2g9DrwNO0GxYTlTcyDHwEHI/gI8AF4LZCv30uAz+J0APAqVe8/wmwErG7gWb5chr4Z07+Rpv37gLOU3pal4FVSnVIod8i19JiX4nQY7l0tmM1WzeV7B6nirEWUc/kxG+XojWAfwM3sm+fKfTb43ai7rN8j92ReuglUWgoDaW+XI67JVJfTupxNxH7Q0rH1Mbcei1Rer2uJ36dhV5LbthMIZq9hr9qU9Iby+tDNf/e33Vf3aQMAZhLOnEvufOhSs59O/v0UV3bGJ1wYB/mEtkfWXsq3eJsKN31dvmQ2YeUTpVmW2IlacloZJ+O6I9tFG59rng9kXktEaYBHIzAq5Xo02wcditPsy9Gsg0A30b2hey7ZYXeeu6nofg8P9+m1FmHUwm5kQg030X5My+p+HyaDcdybG+pXyRi30kE6k9EXsxziwgOTqpXnvg0cg9WUo4lx0QrNDUuVTnuGW+SFVFoEYUWUWgRhRaFFlFoEYUWUWgRhRaFFlFoEYUWUWgRhRaFFsEB/m+V3ZSprhqU265WKfcQXqJ7ps6VDhK6QZm64AxlAsdnlHk4nlAmWXnmoVboOnEKOEeZ1JvKLP5rlHsJr3moFbpOjFKWedv43B8oMwXNm3rYKKRmU121movtKPDLNlPJikJvW24AU7RfLauRnFoUuhZcoswCdIXWM9U3WqQkotDblhnKJIQX27w+SVkox7q7QteG2aQd8y1eey+baYdCU6cZSGcos5BuZBw4FqlFoWsXpVtxnFL1eMfDrtDUaPbRqTZST1KWUz7mYceOlZqwBHydBmKrFZ8+pPQa/oey3ki3MkxZSXaoMrnlEjVezq2TZx+9TVn56VSicpUJSkfLNGWe6G4b49FPWSmsuWjQcKX98QD4m0Jvz8bh15Ta9GSL18+k8ThPWcKMLlrIvpET/WyE7qmkanMKvX25SalJHwU+aHG5PZu0YyFbJ6eUeyld/ycTmU+3WO98jA5Zv7FThV6sROhDLVbEagC/SR79iM5bc6Un6dX7aQT/HPgFsMdGYX2ZAj4HDgO/a/H6WcqaK/PJuTvleE4kIv8sUfk4ZfGkl/GAmi9a3w1CrwFXKYuxT7ZYNnlXRF9I3j1b8zt2JigdR8ci8UnaL4HMhtr9hU6ocNAFK6rOAv+IzH/m/5cCPpJIvZCGUd3WZdkZiY8AJ9JmOEq5De1VrKSd8Snwr05pS3TDEsFTwGeU7u/ft3j9o6Qec8AXNfg+Q8mF9+XKcyIR+QSbr9VfrmxfdUq60S1CL6WBOJ5IvXGw/wDl9q0Fyj2IU2zvzpD3InLzpuDGJv/9SgS+mMebEXnZRmH9uBup9yfXHGpRo/1tZeH2hW1SqdhJKalV8+NGGrojm/w7j9KWuJzHK8mX17DKUWuupZE0Dpxv8frpylrXF9i6exCHKLXj/dkOJBpP5mdeY1zLlzmRpxKR7+SKhWW7zkk99kWUoy3ec54yp8c6peT38C2mE3si8sGKxIfzWQde42/dqUTkK5F5oVMjcjcLTVKKi7mE721R1hoAPsnPg5Fi5g18jh1JGfZQasQ/jbgHk1oceE2Jm43fK5F5upIj42i7zuZqIuII8Cegr4XUf0zuuj9R/Qal8+Hp99jPwzmBxpL27NuQVuxv8Vk2c9WZTmpxLVLPJt1Yw+GjXcE6ZVDSCKVD4uM2DbJzuewfp9wFMxdRViij9J7nb61X/u7GfTuYnHh3RH63kh+Pf8dbwlZy1biR7XoeZ1OlwfHQ3cdyUo/hCHeuzfvGsy1RusibnS9NqdeBFxvEbp4QAxG6Gpm/z1iKuUTjqQg9k+cWO72hp9Cbz6cvVC7z517RaJuk9XDUN8l8Rd5p4Bal5LagxApNm/r0Z4myS5Spwwa2wYl2KxLfSipxtxKN19VWoXnFeI9VSolukdIVfuQt5/R38jmaEXgmzzXr4mseJoV+HZrizKdi8EGkPpBqRN8P+H89yIkzD9xL5L1X+f0bJ5ZU6B+Cp5SBOjOUUt1EGoR7KxWRwaQkvZG8t02FpNlIXE3jcRn4L2WY6v1si5H7QaoTK6YTCs0b6lG8TumYGEuFYjdl/PSOCD0QcXvbTAXRSugl4NsI/NhGnUKzBfXqxWyCE82IKLSIQosotCi0iEKLKLSIQosotCi0iEKLKLSIQotCiyi0iEKLKLSIQotCiyi0iEKLKLSIQotCiyi0iEKLKLSIQotCiyi0iEKLKLSIQotCiyi0iEKLKLSIQotCiyi0iEKLKLSIQotCiyi0iEKLvD7/A4a/3K5q1IvhAAAAAElFTkSuQmCC\">\n<style>\n  /* patrickcollison.com's clothes, measured off the live stylesheet: plain\n     Helvetica, Myriad Pro / Helvetica Neue headings, #0864c7 links, a narrow\n     column on white. The writing room (write.html) wears the same, so typing\n     there is seeing this page. */\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  html { -webkit-text-size-adjust: 100%; }\n\n  body {\n    font-family: Helvetica, Arial, sans-serif;\n    font-size: 14px;\n    line-height: 1.7;\n    color: #222;\n    background: #ffffff;\n    min-height: 100vh;\n  }\n\n  .wrap {\n    max-width: 540px;\n    margin: 0 auto;\n    padding: 56px 20px 120px;\n  }\n\n  .back {\n    color: #aaa;\n    font-size: 12px;\n    text-decoration: none;\n  }\n  .back:hover { color: #222; }\n\n  .title {\n    font-family: \"Myriad Pro\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n    font-size: 26px;\n    font-weight: 600;\n    line-height: 1.2;\n    margin-top: 12px;\n  }\n\n  .lede {\n    font-size: 11px;\n    color: #aaa;\n    margin: 6px 0 26px;\n  }\n\n  p { margin-bottom: 1em; }\n\n  a { color: #0864c7; }\n  a.back { color: #aaa; }\n  a.back:hover { color: #222; }\n\n  hr {\n    border: none;\n    border-top: 1px solid #eee;\n    margin: 1.8em 0;\n  }\n\n  strong { font-weight: 600; }\n\n  /* citation notes and credits at the foot of an essay */\n  .note { font-size: 12px; color: #888; }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n\n  <!-- ../ because topic pages live in writing/ -->\n  <a class=\"back\" href=\"../writing.html\">&larr; writing</a>\n  <h1 class=\"title\">TOPIC</h1>\n  <p class=\"lede\">MONTH YEAR</p>\n\n  <!-- ==========================================================================\n       THE ESSAY. Plain HTML: <p>, <strong>, <em>, <a href>, <hr>, &mdash;.\n       Write it in write.html and export, or by hand here.\n       ========================================================================== -->\n\n  <p>first paragraph.</p>\n\n</div>\n</body>\n</html>\n";

  var titleEl = document.getElementById("title");
  var bodyEl  = document.getElementById("body");
  var bylineEl = document.getElementById("byline");
  var statusEl = document.getElementById("status");
  var draftsEl = document.getElementById("drafts");

  var MONTHS = ["january","february","march","april","may","june","july",
                "august","september","october","november","december"];
  function monthYear() {
    var d = new Date();
    return MONTHS[d.getMonth()] + " " + d.getFullYear();
  }
  bylineEl.textContent = monthYear();

  // ---- drafts, in localStorage ----------------------------------------
  // One key holds the index; each draft holds title + body html. file:// and
  // the published origin have separate storage — drafts live where you write.
  var INDEX = "writingroom:index";
  var current = null;

  function loadIndex() {
    try { return JSON.parse(localStorage.getItem(INDEX)) || []; }
    catch (e) { return []; }
  }
  function saveIndex(ix) { localStorage.setItem(INDEX, JSON.stringify(ix)); }

  function draftKey(id) { return "writingroom:draft:" + id; }

  function refreshMenu() {
    var ix = loadIndex();
    draftsEl.innerHTML = "";
    ix.forEach(function (d) {
      var o = document.createElement("option");
      o.value = d.id;
      o.textContent = d.title || "untitled";
      if (d.id === current) o.selected = true;
      draftsEl.appendChild(o);
    });
  }

  function newDraft() {
    var id = String(Date.now());
    var ix = loadIndex();
    ix.unshift({ id: id, title: "" });
    saveIndex(ix);
    current = id;
    titleEl.textContent = "";
    bodyEl.innerHTML = "";
    refreshMenu();
    updateEmpties();
    titleEl.focus();
  }

  function openDraft(id) {
    var raw = localStorage.getItem(draftKey(id));
    var d = raw ? JSON.parse(raw) : { title: "", body: "" };
    current = id;
    titleEl.textContent = d.title || "";
    bodyEl.innerHTML = d.body || "";
    refreshMenu();
    updateEmpties();
  }

  var saveTimer = 0;
  function save() {
    if (!current) return;
    localStorage.setItem(draftKey(current), JSON.stringify({
      title: titleEl.textContent,
      body: bodyEl.innerHTML
    }));
    var ix = loadIndex();
    ix.forEach(function (d) { if (d.id === current) d.title = titleEl.textContent; });
    saveIndex(ix);
    refreshMenu();
    var words = (bodyEl.textContent.match(/\S+/g) || []).length;
    statusEl.textContent = "saved · " + words + (words === 1 ? " word" : " words");
  }
  function queueSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 400);
    updateEmpties();
  }

  function updateEmpties() {
    titleEl.setAttribute("data-empty", titleEl.textContent.trim() ? "false" : "true");
    bodyEl.setAttribute("data-empty", bodyEl.textContent.trim() ? "false" : "true");
  }

  function deleteDraft() {
    if (!current) return;
    if (!window.confirm("delete this draft? there is no undo.")) return;
    localStorage.removeItem(draftKey(current));
    saveIndex(loadIndex().filter(function (d) { return d.id !== current; }));
    var ix = loadIndex();
    if (ix.length) openDraft(ix[0].id); else newDraft();
  }

  // ---- serialising the contenteditable into clean site html ------------
  // contenteditable emits a soup of divs and styled spans. The export walks
  // it and keeps only what the site's pages use: p, em, strong, a, hr.
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escAttr(s) { return esc(s).replace(/"/g, "&quot;"); }

  function inlineOf(node) {
    if (node.nodeType === 3) return esc(node.nodeValue);
    if (node.nodeType !== 1) return "";
    var tag = node.tagName;
    if (tag === "BR") return " ";
    var inner = "";
    for (var i = 0; i < node.childNodes.length; i++) {
      inner += inlineOf(node.childNodes[i]);
    }
    if (tag === "EM" || tag === "I") return inner ? "<em>" + inner + "</em>" : "";
    if (tag === "STRONG" || tag === "B") return inner ? "<strong>" + inner + "</strong>" : "";
    if (tag === "SPAN" && inner) {
      // Styled spans arrive from pasted rich text and some execCommand paths.
      // Honour bold/italic styling; everything else about the span is noise.
      var fw = node.style && node.style.fontWeight;
      var fs = node.style && node.style.fontStyle;
      if (fw === "bold" || parseInt(fw, 10) >= 600) inner = "<strong>" + inner + "</strong>";
      if (fs === "italic") inner = "<em>" + inner + "</em>";
      return inner;
    }
    if (tag === "A" && node.getAttribute("href")) {
      return "<a href=\"" + escAttr(node.getAttribute("href")) + "\">" + inner + "</a>";
    }
    return inner;                      // spans, fonts, everything else: unwrap
  }

  function serialize() {
    var out = [], run = "";
    function flush() {
      var t = run.replace(/\s+/g, " ").trim();
      if (t) out.push("  <p>" + t + "</p>");
      run = "";
    }
    var kids = bodyEl.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var n = kids[i];
      if (n.nodeType === 1 && (n.tagName === "DIV" || n.tagName === "P")) {
        flush();
        if (n.querySelector && n.querySelector("hr") || n.tagName === "HR") {
          out.push("  <hr>");
          continue;
        }
        run = inlineOf(n);
        flush();
      } else if (n.nodeType === 1 && n.tagName === "HR") {
        flush();
        out.push("  <hr>");
      } else {
        run += inlineOf(n);
      }
    }
    flush();
    return out.join("\n\n");
  }

  function slugOf(title) {
    return (title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")
            || "untitled");
  }

  function buildPage() {
    var title = titleEl.textContent.trim() || "untitled";
    var body = serialize() || "  <p></p>";
    return TEMPLATE
      .split("TOPIC").join(esc(title))
      .split("MONTH YEAR").join(monthYear())
      .replace("  <p>first paragraph.</p>", body);
  }

  // ---- proofreading ----------------------------------------------------
  // LanguageTool's public API: real grammar and spelling, one POST, no key.
  // The only network request this page ever makes, and only when asked —
  // proofread sends the essay text to languagetool.org, which is disclosed in
  // the hint below the editor. Offline, the browser's own squiggles remain.
  var issuesEl = document.getElementById("issues");
  var proofClean = false;      // goes false on any edit; true after a clean check
  var exportAnyway = false;    // one-shot: a second export click skips the gate

  function proofread(done) {
    var text = bodyEl.innerText;
    if (!text.trim()) {
      renderIssues([], text);
      if (done) done(0);
      return;
    }
    statusEl.textContent = "checking…";
    var params = new URLSearchParams();
    params.set("text", text);
    params.set("language", "en-US");
    fetch("https://api.languagetool.org/v2/check", { method: "POST", body: params })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var matches = data.matches || [];
        renderIssues(matches, text);
        if (done) done(matches.length);
      })
      .catch(function () {
        statusEl.textContent =
          "proofread needs the internet — the browser's spellcheck squiggles still work";
        if (done) done(-1);
      });
  }

  function renderIssues(matches, text) {
    issuesEl.innerHTML = "";
    proofClean = matches.length === 0;
    issuesEl.hidden = proofClean;
    if (proofClean) {
      statusEl.textContent = "proofread: no issues found";
      return;
    }
    statusEl.textContent = "proofread: " + matches.length +
      (matches.length === 1 ? " issue" : " issues");

    var head = document.createElement("div");
    head.className = "issues-head";
    head.textContent = matches.length + " from languagetool.org — click a phrase to jump to it";
    issuesEl.appendChild(head);

    matches.forEach(function (m) {
      var snippet = text.substr(m.offset, m.length);
      if (!snippet) return;
      // Which occurrence of this snippet is it? window.find walks the page in
      // order, so the fix must land on the right duplicate of a common word.
      var occurrence = 0, at = -1;
      while ((at = text.indexOf(snippet, at + 1)) !== -1 && at < m.offset) occurrence++;

      var row = document.createElement("div");
      row.className = "issue";

      var find = document.createElement("button");
      find.type = "button";
      find.className = "find";
      find.textContent = "“" + (snippet.length > 40 ? snippet.slice(0, 40) + "…" : snippet) + "”";
      find.addEventListener("click", function () { locate(snippet, occurrence); });
      row.appendChild(find);

      var msg = document.createElement("span");
      msg.className = "msg";
      msg.textContent = " — " + m.message;
      row.appendChild(msg);

      (m.replacements || []).slice(0, 3).forEach(function (rep) {
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = rep.value;
        chip.addEventListener("click", function () {
          if (locate(snippet, occurrence)) {
            document.execCommand("insertText", false, rep.value);
            save();
            // offsets have all shifted; check again rather than trusting them
            setTimeout(function () { proofread(); }, 250);
          }
        });
        row.appendChild(chip);
      });

      issuesEl.appendChild(row);
    });
  }

  // Select the nth occurrence of a snippet inside the editor. window.find
  // walks the whole document, so hits outside the essay (the issue list shows
  // the same snippet, for one) are skipped without being counted.
  function locate(snippet, occurrence) {
    bodyEl.focus();
    var sel = window.getSelection();
    sel.removeAllRanges();
    var r = document.createRange();
    r.setStart(bodyEl, 0);
    r.collapse(true);
    sel.addRange(r);
    var seen = -1;
    for (var guard = 0; guard < 80; guard++) {
      if (!window.find(snippet, false, false, false)) return false;
      var anchor = sel.anchorNode;
      if (anchor && bodyEl.contains(anchor)) {
        seen++;
        if (seen === occurrence) return true;
      }
    }
    return false;
  }

  function doExport() {
    var html = buildPage();
    var slug = slugOf(titleEl.textContent);
    var blob = new Blob([html], { type: "text/html" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = slug + ".html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    exportAnyway = false;
    if (window.__writingroom) window.__writingroom.exports++;
    statusEl.textContent = "exported " + slug + ".html — move it into writing/";
  }

  // The end-of-session check: exporting proofreads first. Clean → export.
  // Issues → they're listed, and a second click exports anyway. Offline →
  // export with a note, because a grammar check should never hold words
  // hostage to the network.
  function exportPage() {
    save();
    if (proofClean || exportAnyway) { doExport(); return; }
    proofread(function (n) {
      if (n === 0) {
        doExport();
      } else if (n < 0) {
        statusEl.textContent += " — exporting without it";
        doExport();
      } else {
        exportAnyway = true;
        statusEl.textContent = "proofread: " + n +
          (n === 1 ? " issue" : " issues") + " — fix below, or export again to export anyway";
      }
    });
  }

  function copyHtml() {
    save();
    var html = buildPage();
    function done(ok) {
      statusEl.textContent = ok ? "html copied" : "copy failed — use export instead";
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(html).then(function () { done(true); },
                                              function () { done(false); });
    } else { done(false); }
  }

  // ---- wiring ----------------------------------------------------------
  titleEl.addEventListener("input", queueSave);
  bodyEl.addEventListener("input", queueSave);
  // Any edit invalidates the last check and the export-anyway grace.
  bodyEl.addEventListener("input", function () { proofClean = false; exportAnyway = false; });
  document.getElementById("proof").addEventListener("click", function () { proofread(); });
  // A title is one line; enter should take you to the words.
  titleEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); bodyEl.focus(); }
  });
  bodyEl.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      var url = window.prompt("link to:", "https://");
      if (url) document.execCommand("createLink", false, url);
    }
  });
  document.getElementById("new").addEventListener("click", newDraft);
  document.getElementById("export").addEventListener("click", exportPage);
  document.getElementById("copy").addEventListener("click", copyHtml);
  document.getElementById("del").addEventListener("click", deleteDraft);
  draftsEl.addEventListener("change", function () { save(); openDraft(draftsEl.value); });

  // Paste as plain text: pasted rich text drags foreign fonts and colours
  // into the page, and the export would strip them anyway.
  [titleEl, bodyEl].forEach(function (el) {
    el.addEventListener("paste", function (e) {
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData("text/plain");
      document.execCommand("insertText", false, t);
    });
  });

  // expose for the test harness only
  window.__writingroom = { serialize: serialize, buildPage: buildPage,
                           slugOf: slugOf, proofread: proofread, exports: 0 };

  var ix = loadIndex();
  if (ix.length) openDraft(ix[0].id); else newDraft();
})();
</script>
</body>
</html>
