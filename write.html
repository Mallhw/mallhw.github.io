<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the writing room</title>
<meta name="robots" content="noindex">
<style>
  /* patrickcollison.com's clothes, measured off the live stylesheet: plain
     Helvetica body, Myriad Pro / Helvetica Neue headings, #0864c7 links, a
     narrow column on white. The point of this page is that typing here feels
     like typing onto a finished site, not into a docs toolbar. */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.7;
    color: #222;
    background: #ffffff;
    min-height: 100vh;
  }

  a { color: #0864c7; }

  .page {
    max-width: 540px;
    margin: 0 auto;
    padding: 56px 20px 120px;
  }

  /* ---- the quiet menu, collison-style, top right ---- */
  .menu {
    position: fixed;
    top: 24px;
    right: 24px;
    text-align: right;
    font-family: "Myriad Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 12px;
    line-height: 2;
    max-width: 180px;
  }
  .menu button, .menu select {
    display: block;
    margin-left: auto;
    background: none;
    border: none;
    font: inherit;
    color: #0864c7;
    cursor: pointer;
    padding: 0;
    text-align: right;
  }
  .menu select { direction: rtl; max-width: 180px; }
  .menu button:hover { text-decoration: underline; }
  .menu .status {
    color: #aaa;
    font-size: 10px;
    margin-top: 8px;
  }
  @media (max-width: 900px) {
    .menu { position: static; text-align: left; margin: 0 0 32px; }
    .menu button, .menu select { margin-left: 0; text-align: left; }
  }

  /* ---- the essay being written ---- */
  h1 {
    font-family: "Myriad Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.2;
    outline: none;
  }
  .byline {
    font-size: 10px;
    color: #aaa;
    margin: 6px 0 26px;
  }
  #body {
    outline: none;
    min-height: 55vh;
    white-space: pre-wrap;
  }
  #body p { margin-bottom: 1em; }
  #body hr { border: none; border-top: 1px solid #ddd; margin: 1.6em 0; }

  /* Placeholders that vanish the moment there are words. */
  [data-empty="true"]::before {
    content: attr(data-placeholder);
    color: #ccc;
    cursor: text;
  }

  .hint {
    margin-top: 64px;
    font-size: 10px;
    color: #ccc;
  }
</style>
</head>
<body>

<div class="menu">
  <select id="drafts" aria-label="drafts"></select>
  <button id="new" type="button">new draft</button>
  <button id="export" type="button">export page</button>
  <button id="copy" type="button">copy html</button>
  <button id="del" type="button">delete draft</button>
  <div class="status" id="status">&nbsp;</div>
</div>

<div class="page">
  <h1 id="title" contenteditable="true" spellcheck="true"
      data-placeholder="untitled"></h1>
  <p class="byline" id="byline"></p>
  <div id="body" contenteditable="true" spellcheck="true"
       data-placeholder="start typing. cmd+b bold, cmd+i italic, cmd+k link."></div>
  <p class="hint">
    autosaves to this browser as you type. export writes writing/&lt;slug&gt;.html
    for the site &mdash; then run <code>python3 build/regen-fonts.py</code> and add
    the row to writing.html.
  </p>
</div>

<script>
(function () {
  "use strict";

  var TEMPLATE = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<!-- 1. Title: keep the em dash pattern. 2. Description: one sentence. -->\n<title>TOPIC \u2014 matthew li</title>\n<meta name=\"description\" content=\"matthew li on TOPIC.\">\n<link rel=\"icon\" href=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAYAAAA9zQYyAAAIxElEQVR42u2d3WtV2RmHn4Z8GEKqZkKwjmkQHc3IQTtakWmtLYNUSinCXMxNodC7/hW96V3/pmGQaacidkZHQvxIJWhMJogfY0OI0Rh6sX4HNuk5GmdGk33O88DmJOcc4zl7P/vd73rX2mv96O9//QsinUKPu0AUWkShRRRaRKFFoUUUWkShRRRaRKFFoUUUWkShRRRaRKFFoUUUWkShRRRaRKFFoUUUWkShRRRaRKFFoUUUWkShRRRaRKFFoUUUWkShRRRaRKFFoUUUWkShRRRaFFpEoUUUWkShRRRaFFpEoUUUWkShRRRaFFpEoUUUWkShRRRaFFpEoUUUWkShRRRaFFpEoUW2it4af/Z9wAAwBAzn5xfAE2ABuO/hVeg68S7QH5l/DOzI84/zvfqBRWDNw6zQdeD9ROWdwK6I3ZMIPQ/ci9APsj3xcCv0duZk0o0RYDRiDwDLEfpOUo8FYC6/38vrotDbjtOJyqN5rHI0OXQzUt8CriaC3wTWPfQKvd04nIjcjrFsR4AJoA94FNEfdsnx3Q/8GvgYOAsM5vt/CXwBfA581UlXrTqX7fo2+b4BoJETYDwpSrfQH4mH89g80SeAA8ChSN9vhN56vomcg5s8cUfz/uEukXlH9s1Q2hdVjmSf9MSBoaRljxV667gOvJOoO7rJSN2byN5L55fz+irft1VqNkkpfY4nSl9KO2NWobeGK7l8LqURuOsV739eaQx2g9DrwNO0GxYTlTcyDHwEHI/gI8AF4LZCv30uAz+J0APAqVe8/wmwErG7gWb5chr4Z07+Rpv37gLOU3pal4FVSnVIod8i19JiX4nQY7l0tmM1WzeV7B6nirEWUc/kxG+XojWAfwM3sm+fKfTb43ai7rN8j92ReuglUWgoDaW+XI67JVJfTupxNxH7Q0rH1Mbcei1Rer2uJ36dhV5LbthMIZq9hr9qU9Iby+tDNf/e33Vf3aQMAZhLOnEvufOhSs59O/v0UV3bGJ1wYB/mEtkfWXsq3eJsKN31dvmQ2YeUTpVmW2IlacloZJ+O6I9tFG59rng9kXktEaYBHIzAq5Xo02wcditPsy9Gsg0A30b2hey7ZYXeeu6nofg8P9+m1FmHUwm5kQg030X5My+p+HyaDcdybG+pXyRi30kE6k9EXsxziwgOTqpXnvg0cg9WUo4lx0QrNDUuVTnuGW+SFVFoEYUWUWgRhRaFFlFoEYUWUWgRhRaFFlFoEYUWUWgRhRaFFsEB/m+V3ZSprhqU265WKfcQXqJ7ps6VDhK6QZm64AxlAsdnlHk4nlAmWXnmoVboOnEKOEeZ1JvKLP5rlHsJr3moFbpOjFKWedv43B8oMwXNm3rYKKRmU121movtKPDLNlPJikJvW24AU7RfLauRnFoUuhZcoswCdIXWM9U3WqQkotDblhnKJIQX27w+SVkox7q7QteG2aQd8y1eey+baYdCU6cZSGcos5BuZBw4FqlFoWsXpVtxnFL1eMfDrtDUaPbRqTZST1KWUz7mYceOlZqwBHydBmKrFZ8+pPQa/oey3ki3MkxZSXaoMrnlEjVezq2TZx+9TVn56VSicpUJSkfLNGWe6G4b49FPWSmsuWjQcKX98QD4m0Jvz8bh15Ta9GSL18+k8ThPWcKMLlrIvpET/WyE7qmkanMKvX25SalJHwU+aHG5PZu0YyFbJ6eUeyld/ycTmU+3WO98jA5Zv7FThV6sROhDLVbEagC/SR79iM5bc6Un6dX7aQT/HPgFsMdGYX2ZAj4HDgO/a/H6WcqaK/PJuTvleE4kIv8sUfk4ZfGkl/GAmi9a3w1CrwFXKYuxT7ZYNnlXRF9I3j1b8zt2JigdR8ci8UnaL4HMhtr9hU6ocNAFK6rOAv+IzH/m/5cCPpJIvZCGUd3WZdkZiY8AJ9JmOEq5De1VrKSd8Snwr05pS3TDEsFTwGeU7u/ft3j9o6Qec8AXNfg+Q8mF9+XKcyIR+QSbr9VfrmxfdUq60S1CL6WBOJ5IvXGw/wDl9q0Fyj2IU2zvzpD3InLzpuDGJv/9SgS+mMebEXnZRmH9uBup9yfXHGpRo/1tZeH2hW1SqdhJKalV8+NGGrojm/w7j9KWuJzHK8mX17DKUWuupZE0Dpxv8frpylrXF9i6exCHKLXj/dkOJBpP5mdeY1zLlzmRpxKR7+SKhWW7zkk99kWUoy3ec54yp8c6peT38C2mE3si8sGKxIfzWQde42/dqUTkK5F5oVMjcjcLTVKKi7mE721R1hoAPsnPg5Fi5g18jh1JGfZQasQ/jbgHk1oceE2Jm43fK5F5upIj42i7zuZqIuII8Cegr4XUf0zuuj9R/Qal8+Hp99jPwzmBxpL27NuQVuxv8Vk2c9WZTmpxLVLPJt1Yw+GjXcE6ZVDSCKVD4uM2DbJzuewfp9wFMxdRViij9J7nb61X/u7GfTuYnHh3RH63kh+Pf8dbwlZy1biR7XoeZ1OlwfHQ3cdyUo/hCHeuzfvGsy1RusibnS9NqdeBFxvEbp4QAxG6Gpm/z1iKuUTjqQg9k+cWO72hp9Cbz6cvVC7z517RaJuk9XDUN8l8Rd5p4Bal5LagxApNm/r0Z4myS5Spwwa2wYl2KxLfSipxtxKN19VWoXnFeI9VSolukdIVfuQt5/R38jmaEXgmzzXr4mseJoV+HZrizKdi8EGkPpBqRN8P+H89yIkzD9xL5L1X+f0bJ5ZU6B+Cp5SBOjOUUt1EGoR7KxWRwaQkvZG8t02FpNlIXE3jcRn4L2WY6v1si5H7QaoTK6YTCs0b6lG8TumYGEuFYjdl/PSOCD0QcXvbTAXRSugl4NsI/NhGnUKzBfXqxWyCE82IKLSIQosotCi0iEKLKLSIQosotCi0iEKLKLSIQotCiyi0iEKLKLSIQotCiyi0iEKLKLSIQotCiyi0iEKLKLSIQotCiyi0iEKLKLSIQotCiyi0iEKLKLSIQotCiyi0iEKLKLSIQotCiyi0iEKLvD7/A4a/3K5q1IvhAAAAAElFTkSuQmCC\">\n<style>\n  :root {\n    --bg: #f3ede1;\n    --fg: #4a4238;\n    --name: #231f1a;\n    --dim: #6e624e;\n    --rule: #e2d9c8;\n  }\n\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n  html { -webkit-text-size-adjust: 100%; }\n\n  body {\n    background: var(--bg);\n    color: var(--fg);\n    font-family: 'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI',\n                 Helvetica, Arial, sans-serif;\n    font-size: 14.8px;\n    font-weight: 400;\n    line-height: 1.8;\n    min-height: 100vh;\n    -webkit-font-smoothing: antialiased;\n  }\n\n  /* A reading page, so the wrap is the homepage's text measure \u2014 520px of\n     Karla is ~75 characters a line \u2014 not the wide two-column box. */\n  .wrap {\n    width: min(90vw, 576px);\n    min-width: 320px;\n    margin: 0 auto;\n    padding: 40px 28px 56px;\n  }\n\n  .back {\n    color: var(--dim);\n    font-size: 12.7px;\n    text-decoration: none;\n  }\n  .back:hover { color: var(--name); }\n\n  .title {\n    color: var(--name);\n    font-size: clamp(28px, 5vw, 44px);\n    font-weight: 500;\n    letter-spacing: -0.02em;\n    line-height: 1.15;\n    margin-top: 10px;\n  }\n\n  .lede { color: var(--dim); font-size: 12.7px; margin-bottom: 26px; }\n\n  p { margin-bottom: 22px; }\n\n  a {\n    color: inherit;\n    text-decoration: underline;\n    text-underline-offset: 3px;\n    text-decoration-thickness: 1px;\n    text-decoration-color: var(--rule);\n  }\n  a:hover { text-decoration-color: currentColor; }\n  a.back { text-decoration: none; }\n\n  hr {\n    border: none;\n    border-top: 1px solid var(--rule);\n    margin: 24px 0;\n  }\n\n  strong { color: var(--name); font-weight: 600; }\n  em { font-style: italic; }\n\n  /* ===== FONT DATA \u2014 GENERATED, DO NOT HAND-EDIT =====================\n     Filled by  python3 build/regen-fonts.py  \u2014 run it once after creating\n     this page and the typeface embeds itself. Skip past; nothing below the\n     marker is editable by hand.\n     ================================================================== */\n  /* ===== END FONT DATA ============================================== */\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n\n  <!-- ../ because topic pages live in writing/ -->\n  <a class=\"back\" href=\"../writing.html\">&larr; writing</a>\n  <h1 class=\"title\">TOPIC</h1>\n  <p class=\"lede\">MONTH YEAR</p>\n\n  <!-- ==========================================================================\n       THE ESSAY. Plain HTML: <p>, <strong>, <em>, <a href>, <hr>, &mdash;.\n       After writing, run  python3 build/regen-fonts.py  once so the typeface\n       embeds, then add the topic's row to writing.html.\n       ========================================================================== -->\n\n  <p>first paragraph.</p>\n\n</div>\n</body>\n</html>\n";

  var titleEl = document.getElementById("title");
  var bodyEl  = document.getElementById("body");
  var bylineEl = document.getElementById("byline");
  var statusEl = document.getElementById("status");
  var draftsEl = document.getElementById("drafts");

  var MONTHS = ["january","february","march","april","may","june","july",
                "august","september","october","november","december"];
  function monthYear() {
    var d = new Date();
    return MONTHS[d.getMonth()] + " " + d.getFullYear();
  }
  bylineEl.textContent = monthYear();

  // ---- drafts, in localStorage ----------------------------------------
  // One key holds the index; each draft holds title + body html. file:// and
  // the published origin have separate storage — drafts live where you write.
  var INDEX = "writingroom:index";
  var current = null;

  function loadIndex() {
    try { return JSON.parse(localStorage.getItem(INDEX)) || []; }
    catch (e) { return []; }
  }
  function saveIndex(ix) { localStorage.setItem(INDEX, JSON.stringify(ix)); }

  function draftKey(id) { return "writingroom:draft:" + id; }

  function refreshMenu() {
    var ix = loadIndex();
    draftsEl.innerHTML = "";
    ix.forEach(function (d) {
      var o = document.createElement("option");
      o.value = d.id;
      o.textContent = d.title || "untitled";
      if (d.id === current) o.selected = true;
      draftsEl.appendChild(o);
    });
  }

  function newDraft() {
    var id = String(Date.now());
    var ix = loadIndex();
    ix.unshift({ id: id, title: "" });
    saveIndex(ix);
    current = id;
    titleEl.textContent = "";
    bodyEl.innerHTML = "";
    refreshMenu();
    updateEmpties();
    titleEl.focus();
  }

  function openDraft(id) {
    var raw = localStorage.getItem(draftKey(id));
    var d = raw ? JSON.parse(raw) : { title: "", body: "" };
    current = id;
    titleEl.textContent = d.title || "";
    bodyEl.innerHTML = d.body || "";
    refreshMenu();
    updateEmpties();
  }

  var saveTimer = 0;
  function save() {
    if (!current) return;
    localStorage.setItem(draftKey(current), JSON.stringify({
      title: titleEl.textContent,
      body: bodyEl.innerHTML
    }));
    var ix = loadIndex();
    ix.forEach(function (d) { if (d.id === current) d.title = titleEl.textContent; });
    saveIndex(ix);
    refreshMenu();
    var words = (bodyEl.textContent.match(/\S+/g) || []).length;
    statusEl.textContent = "saved · " + words + (words === 1 ? " word" : " words");
  }
  function queueSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 400);
    updateEmpties();
  }

  function updateEmpties() {
    titleEl.setAttribute("data-empty", titleEl.textContent.trim() ? "false" : "true");
    bodyEl.setAttribute("data-empty", bodyEl.textContent.trim() ? "false" : "true");
  }

  function deleteDraft() {
    if (!current) return;
    if (!window.confirm("delete this draft? there is no undo.")) return;
    localStorage.removeItem(draftKey(current));
    saveIndex(loadIndex().filter(function (d) { return d.id !== current; }));
    var ix = loadIndex();
    if (ix.length) openDraft(ix[0].id); else newDraft();
  }

  // ---- serialising the contenteditable into clean site html ------------
  // contenteditable emits a soup of divs and styled spans. The export walks
  // it and keeps only what the site's pages use: p, em, strong, a, hr.
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escAttr(s) { return esc(s).replace(/"/g, "&quot;"); }

  function inlineOf(node) {
    if (node.nodeType === 3) return esc(node.nodeValue);
    if (node.nodeType !== 1) return "";
    var tag = node.tagName;
    if (tag === "BR") return " ";
    var inner = "";
    for (var i = 0; i < node.childNodes.length; i++) {
      inner += inlineOf(node.childNodes[i]);
    }
    if (tag === "EM" || tag === "I") return inner ? "<em>" + inner + "</em>" : "";
    if (tag === "STRONG" || tag === "B") return inner ? "<strong>" + inner + "</strong>" : "";
    if (tag === "SPAN" && inner) {
      // Styled spans arrive from pasted rich text and some execCommand paths.
      // Honour bold/italic styling; everything else about the span is noise.
      var fw = node.style && node.style.fontWeight;
      var fs = node.style && node.style.fontStyle;
      if (fw === "bold" || parseInt(fw, 10) >= 600) inner = "<strong>" + inner + "</strong>";
      if (fs === "italic") inner = "<em>" + inner + "</em>";
      return inner;
    }
    if (tag === "A" && node.getAttribute("href")) {
      return "<a href=\"" + escAttr(node.getAttribute("href")) + "\">" + inner + "</a>";
    }
    return inner;                      // spans, fonts, everything else: unwrap
  }

  function serialize() {
    var out = [], run = "";
    function flush() {
      var t = run.replace(/\s+/g, " ").trim();
      if (t) out.push("  <p>" + t + "</p>");
      run = "";
    }
    var kids = bodyEl.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var n = kids[i];
      if (n.nodeType === 1 && (n.tagName === "DIV" || n.tagName === "P")) {
        flush();
        if (n.querySelector && n.querySelector("hr") || n.tagName === "HR") {
          out.push("  <hr>");
          continue;
        }
        run = inlineOf(n);
        flush();
      } else if (n.nodeType === 1 && n.tagName === "HR") {
        flush();
        out.push("  <hr>");
      } else {
        run += inlineOf(n);
      }
    }
    flush();
    return out.join("\n\n");
  }

  function slugOf(title) {
    return (title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")
            || "untitled");
  }

  function buildPage() {
    var title = titleEl.textContent.trim() || "untitled";
    var body = serialize() || "  <p></p>";
    return TEMPLATE
      .split("TOPIC").join(esc(title))
      .split("MONTH YEAR").join(monthYear())
      .replace("  <p>first paragraph.</p>", body);
  }

  function exportPage() {
    save();
    var html = buildPage();
    var slug = slugOf(titleEl.textContent);
    var blob = new Blob([html], { type: "text/html" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = slug + ".html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    statusEl.textContent = "exported " + slug + ".html — move it into writing/";
  }

  function copyHtml() {
    save();
    var html = buildPage();
    function done(ok) {
      statusEl.textContent = ok ? "html copied" : "copy failed — use export instead";
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(html).then(function () { done(true); },
                                              function () { done(false); });
    } else { done(false); }
  }

  // ---- wiring ----------------------------------------------------------
  titleEl.addEventListener("input", queueSave);
  bodyEl.addEventListener("input", queueSave);
  // A title is one line; enter should take you to the words.
  titleEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); bodyEl.focus(); }
  });
  bodyEl.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      var url = window.prompt("link to:", "https://");
      if (url) document.execCommand("createLink", false, url);
    }
  });
  document.getElementById("new").addEventListener("click", newDraft);
  document.getElementById("export").addEventListener("click", exportPage);
  document.getElementById("copy").addEventListener("click", copyHtml);
  document.getElementById("del").addEventListener("click", deleteDraft);
  draftsEl.addEventListener("change", function () { save(); openDraft(draftsEl.value); });

  // Paste as plain text: pasted rich text drags foreign fonts and colours
  // into the page, and the export would strip them anyway.
  [titleEl, bodyEl].forEach(function (el) {
    el.addEventListener("paste", function (e) {
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData("text/plain");
      document.execCommand("insertText", false, t);
    });
  });

  // expose for the test harness only
  window.__writingroom = { serialize: serialize, buildPage: buildPage, slugOf: slugOf };

  var ix = loadIndex();
  if (ix.length) openDraft(ix[0].id); else newDraft();
})();
</script>
</body>
</html>
