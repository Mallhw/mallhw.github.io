# Refreshes the homepage's Strava caption by rewriting strava.js.
#
# Runs four times a day plus on demand. Commits only when the file actually
# changed — i.e. when a new activity appeared — so the history stays quiet and
# GitHub Pages doesn't redeploy for nothing. Before the repo secrets exist
# (see the README's one-time setup) the script exits 0 without writing, so
# this job is a green no-op rather than a four-times-daily red X.
name: refresh strava caption

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: strava-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch latest activity
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python3 build/regen-strava.py

      - name: commit if changed
        run: |
          if git diff --quiet -- strava.js; then
            echo "no change"
            exit 0
          fi
          git config user.name "strava-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add strava.js
          git commit -m "Refresh the Strava caption"
          git push
